server {
  listen 55703;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Los assets con hash en el nombre son inmutables: se pueden cachear para
  # siempre porque un cambio produce un nombre distinto.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El index nunca se cachea: es el que apunta a los assets nuevos después de un
  # despliegue. Si se cacheara, el navegador seguiría pidiendo los viejos.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # SPA: cualquier ruta desconocida devuelve el index y el ruteo lo resuelve el
  # cliente. (El dashboard usa ruteo por hash, así que en la práctica no hace
  # falta, pero deja la puerta abierta a cambiar a rutas reales sin tocar nginx.)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cabeceras de seguridad. La CSP es estricta a propósito: el dashboard no carga
  # nada de terceros. `unsafe-inline` en style-src es necesario para los estilos
  # en línea que React usa en la barra de progreso.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server_tokens off;
}
